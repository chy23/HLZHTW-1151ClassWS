name: Auto Sync Lessons Branches

on:
  push:
    branches:
      - main
    paths:
      - 'src/data/**'
      - 'public/data/**'
      - 'ultimate_sync.py'
      - 'src/components/**'
      - 'src/App.jsx'

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run ultimate_sync.py
        run: python3 ultimate_sync.py
