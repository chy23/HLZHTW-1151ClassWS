name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Centralized Build
        run: python3 build_all.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./final_dist
          keep_files: false

      - name: Deploy individual lessons to branches
        run: |
          for i in {1..12}; do
            BRANCH="115-1-L$i"
            DIR="./final_dist/$BRANCH"
            if [ -d "$DIR" ]; then
              echo "Deploying $BRANCH..."
              cd "$DIR"
              git init
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add .
              git commit -m "Deploy $BRANCH"
              git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" master:"$BRANCH"
              cd ../../
            fi
          done
